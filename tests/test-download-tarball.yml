name: Test download tarball from release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/downloads-tarball"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: robinraju/release-downloader
          latest: 'true'
          tarBall: 'true'
          out-file-path: downloads-tarball
          token: ${{ github.token }}

      - name: Assert tarball download ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.action.outputs.release_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          echo "release_name: $RELEASE_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG_NAME" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            # Verify a tarball file was actually downloaded
            TARBALL_COUNT=$(find "$GITHUB_WORKSPACE/downloads-tarball" -name "*.tar.gz" | wc -l)
            echo "tarball count: $TARBALL_COUNT"
            if [ "$TARBALL_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one .tar.gz file in downloads-tarball"
              exit 1
            fi
            echo "PASS: tarball downloaded, tag_name='$TAG_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
