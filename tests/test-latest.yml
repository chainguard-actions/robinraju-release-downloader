name: Test latest - download latest release tarball
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/downloads-latest"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: robinraju/release-downloader
          latest: "true"
          tarBall: "true"
          out-file-path: downloads-latest
          token: ${{ github.token }}

      - name: Assert action ran and produced expected results
        env:
          TAG: ${{ steps.action.outputs.tag_name }}
          RELEASE: ${{ steps.action.outputs.release_name }}
          FILES: ${{ steps.action.outputs.downloaded_files }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          echo "release_name: $RELEASE"
          echo "downloaded_files: $FILES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: tag_name output is empty"
              exit 1
            fi
            if [ -z "$RELEASE" ]; then
              echo "FAIL: release_name output is empty"
              exit 1
            fi
            if [ -z "$FILES" ]; then
              echo "FAIL: downloaded_files output is empty"
              exit 1
            fi
            echo "Contents of downloads-latest:"
            ls -la "$GITHUB_WORKSPACE/downloads-latest/" || true
            COUNT=$(find "$GITHUB_WORKSPACE/downloads-latest" -type f | wc -l)
            echo "File count: $COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "FAIL: no files downloaded"
              exit 1
            fi
            echo "PASS: $COUNT file(s) downloaded, tag=$TAG"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
