name: Test basic download by tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: download
        name: Download release asset by tag
        uses: .
        with:
          repository: robinraju/probable-potato
          tag: '1.0.1'
          fileName: potato.jpeg
          out-file-path: downloaded-assets

      - name: Assert tag_name output
        env:
          TAG_NAME: ${{ steps.download.outputs.tag_name }}
        run: |
          echo "tag_name: $TAG_NAME"
          if [ "$TAG_NAME" != "1.0.1" ]; then
            echo "FAIL: expected tag_name to be '1.0.1', got '$TAG_NAME'"
            exit 1
          fi
          echo "PASS: tag_name is correct"

      - name: Assert release_name output is non-empty
        env:
          RELEASE_NAME: ${{ steps.download.outputs.release_name }}
        run: |
          echo "release_name: $RELEASE_NAME"
          if [ -z "$RELEASE_NAME" ]; then
            echo "FAIL: expected release_name to be non-empty"
            exit 1
          fi
          echo "PASS: release_name is non-empty"

      - name: Assert downloaded_files output is non-empty
        env:
          DOWNLOADED_FILES: ${{ steps.download.outputs.downloaded_files }}
        run: |
          echo "downloaded_files: $DOWNLOADED_FILES"
          if [ -z "$DOWNLOADED_FILES" ]; then
            echo "FAIL: expected downloaded_files to be non-empty"
            exit 1
          fi
          echo "PASS: downloaded_files is non-empty"

      - name: Assert file was downloaded
        run: |
          FILE="$GITHUB_WORKSPACE/downloaded-assets/potato.jpeg"
          echo "Checking for file: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file not found at $FILE"
            ls -la "$GITHUB_WORKSPACE/downloaded-assets/" || true
            exit 1
          fi
          echo "PASS: file exists"
