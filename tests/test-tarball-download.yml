name: Test tarball download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/tarball-download"

      - id: download
        uses: .
        continue-on-error: true
        with:
          repository: robinraju/release-downloader
          tag: v1.11
          tarBall: 'true'
          out-file-path: tarball-download
          token: ${{ github.token }}

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.download.outcome }}
          TAG: ${{ steps.download.outputs.tag_name }}
          FILES: ${{ steps.download.outputs.downloaded_files }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          echo "downloaded_files: $FILES"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$TAG" != "v1.11" ]; then
              echo "FAIL: expected tag_name 'v1.11', got '$TAG'"
              exit 1
            fi
            if [ -z "$FILES" ]; then
              echo "FAIL: downloaded_files is empty"
              exit 1
            fi
            echo "PASS: tag_name='$TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API not reachable or rate limited)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert tarball file exists on disk (if action succeeded)
        env:
          OUTCOME: ${{ steps.download.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            ls -la tarball-download/
            COUNT=$(ls tarball-download/*.tar.gz 2>/dev/null | wc -l)
            echo "Tarball count: $COUNT"
            if [ "$COUNT" -lt 1 ]; then
              echo "FAIL: no .tar.gz file found in tarball-download/"
              exit 1
            fi
            echo "PASS: tarball file found"
          else
            echo "SKIP: action did not succeed, skipping file check"
          fi
