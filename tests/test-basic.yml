name: Test basic - download specific release asset by tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/downloads"

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: robinraju/release-downloader
          tag: v1.9
          fileName: release-downloader_1.9_linux_amd64.tar.gz
          out-file-path: downloads
          token: ${{ github.token }}

      - name: Assert action ran and produced expected results
        env:
          TAG: ${{ steps.action.outputs.tag_name }}
          RELEASE: ${{ steps.action.outputs.release_name }}
          FILES: ${{ steps.action.outputs.downloaded_files }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG"
          echo "release_name: $RELEASE"
          echo "downloaded_files: $FILES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: tag_name output is empty"
              exit 1
            fi
            if [ -z "$RELEASE" ]; then
              echo "FAIL: release_name output is empty"
              exit 1
            fi
            if [ -z "$FILES" ]; then
              echo "FAIL: downloaded_files output is empty"
              exit 1
            fi
            ls -la "$GITHUB_WORKSPACE/downloads/" || true
            if [ ! -f "$GITHUB_WORKSPACE/downloads/release-downloader_1.9_linux_amd64.tar.gz" ]; then
              echo "FAIL: expected downloaded file not found"
              exit 1
            fi
            echo "PASS: file downloaded successfully, tag=$TAG"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
