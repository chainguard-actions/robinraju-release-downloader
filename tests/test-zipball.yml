name: Test zipball download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: robinraju/release-downloader
          tag: "v1.7"
          zipBall: "true"
          out-file-path: "downloaded-zipball"
        continue-on-error: true

      - name: Assert zipball download ran or failed gracefully
        env:
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG_NAME" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            # Verify the zipball file was actually downloaded
            ZIPBALL_COUNT=$(find downloaded-zipball -name "*.zip" 2>/dev/null | wc -l)
            echo "zipball files found: $ZIPBALL_COUNT"
            if [ "$ZIPBALL_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one .zip file in downloaded-zipball/"
              exit 1
            fi
            echo "PASS: zipball downloaded, tag_name='$TAG_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API call may have failed under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
