name: Test tarball download
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          repository: robinraju/release-downloader
          tag: "v1.7"
          tarBall: "true"
          out-file-path: "downloaded-tarball"
        continue-on-error: true

      - name: Assert tarball download ran or failed gracefully
        env:
          TAG_NAME: ${{ steps.action.outputs.tag_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag_name: $TAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG_NAME" ]; then
              echo "FAIL: action succeeded but tag_name output is empty"
              exit 1
            fi
            # Verify the tarball file was actually downloaded
            TARBALL_COUNT=$(find downloaded-tarball -name "*.tar.gz" 2>/dev/null | wc -l)
            echo "tarball files found: $TARBALL_COUNT"
            if [ "$TARBALL_COUNT" -lt 1 ]; then
              echo "FAIL: expected at least one .tar.gz file in downloaded-tarball/"
              exit 1
            fi
            echo "PASS: tarball downloaded, tag_name='$TAG_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API call may have failed under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
